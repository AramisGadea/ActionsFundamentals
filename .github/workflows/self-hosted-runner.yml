name: Demo Self-Hosted Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-on-selfhosted:
    runs-on: self-hosted  # Usa el runner autohospedado
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Verificar entorno
        run: |
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }}"
          echo "Arch: ${{ runner.arch }}"
          
      - name: Ejecutar comando personalizado
        run: |
          echo "Ejecutando en infraestructura propia"
          # Aquí puedes acceder a recursos internos
